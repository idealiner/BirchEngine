<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrincessOwliviaCB</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 20%, #1e293b 0%, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }

    .layout {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
    }

    .frame {
      width: min(1024px, 96vw);
      border: 2px solid #334155;
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      background: #000;
      image-rendering: pixelated;
    }

    #status {
      padding: 10px 12px;
      font-size: 14px;
      color: var(--muted);
      border-top: 1px solid #334155;
    }

    #status.ready {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="frame">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      <div id="status">Loading PrincessOwliviaCB...</div>
    </div>
  </div>

  <script>
    var statusElement = document.getElementById('status');

    var Module = {
      preRun: [],
      postRun: [function () {
        if (statusElement) {
          statusElement.textContent = 'Ready';
          statusElement.classList.add('ready');
        }
      }],
      canvas: (function () {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('webglcontextlost', function (e) {
          alert('WebGL context lost. Please reload the page.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function (text) {
        if (!statusElement) return;
        statusElement.textContent = text || '';
      },
      print: function (text) {
        console.log(text);
      },
      printErr: function (text) {
        if (typeof text === 'string' && text.indexOf('emscripten_set_main_loop_timing: Cannot set timing mode') !== -1) {
          return;
        }
        console.error(text);
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
